{{ myDate | date:"medium" }}
<div class="header">
    <div class="content-container-header">
        <div class="header-left">
            <div>
                <img src="assets/Frame.svg" alt="logo">
            </div>
            <nav class="header-nav">
                <div class="header-nav-item">{{ Header1Item1 }}</div>
                <div class="header-nav-item">{{ Header12 }}</div>
                <div class="header-nav-item" *ngIf = "isShowCatalog">{{ Header1Item3 }}</div>
            </nav>

            <div class="header-nav">
                <button type="button" (click)="isShowCatalog = !isShowCatalog" class="header-btn" yellow-cart>Скрыть/Показать Каталог</button>
                <button type="button" (click)="changeMenuText()" class="header-btn" yellow-cart>Изменить текст</button>
                <button routerLink="/users" class="header-btn" yellow-cart>Пользователи</button>
                <button class="header-btn" yellow-cart *ngIf="!authService.isAdmin" (click)="openDialog()" >Войти</button>
                <button class="header-btn" yellow-cart *ngIf="authService.isAdmin" (click)="authService.logOut()">Выход</button>
                <button (click)="checkStatus()">Check</button>
            </div>
        </div>

        <div class="header-right">
            <div class="header-tel">
                <img src="/assets/Phone.svg" alt="Phone" style="margin-right: 10px;">
                <p>+7 (965) 084-29-29</p>
            </div>
            <img src="/assets/heart 1.svg" alt="">
            
            <div>
                <button  type="button" class="button-empty"  yellow-cart>
                    <img src="/assets/cart.svg" alt="Save icon"/>
                    Пусто
                </button>
            </div>
        </div>
    </div>
</div>
<div class="header-yellow">
    <div class="content-container-header">
        <div class="header-left2">
            <img src="/assets/light.svg" alt="">
            <nav class="header-nav">
                <div class="header-nav-item" *ngFor="let item of menuItems">{{ item }}</div>
            </nav>
        </div>
        <div class="header-left">
            <div>
                <input placeholder="Поиск, например Круг зачистной" class="input">
            </div>
            <div class="location">
                <img src="/assets/map-pin (2) 1.svg" alt="" style="margin-right: 4px;">
                <p>Москва</p>
            </div>
        </div>
    </div>
</div>

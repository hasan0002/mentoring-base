<div  class="user-block__item">
    <p>{{ user.name }}</p>
    <p>{{ user.email }}</p>
    <p>{{ user.website }}</p>
    <p>{{ user.company.name }}</p>
    <p>{{ user.phone | dashPipe }}</p>
    
    <button (click)=onDeleteUser(user.id) class="delete-user" shadow-butn>Удалить юзера</button>
    <button mat-button="elevated" class="create-button" (click)="openDialog()" shadow-butn>Редактировать юзера</button>
</div>

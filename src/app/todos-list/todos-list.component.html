<div class="item-list content-container">
    <app-create-todos-form (createTodos)="createTodos($event)"></app-create-todos-form>
    <div class="form-block">
        <div *ngFor="let item of todos$ | async">
            <app-todos-card [todos]="item" (deleteTodos)="deleteTodos($event)"></app-todos-card>
        </div>
    </div>
</div>
